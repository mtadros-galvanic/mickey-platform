---
- name: Bootstrap the Galvanic website development VM
  hosts: website_vms
  become: true
  gather_facts: true

  vars:
    mickey_guest_admin_password_hash: "{{ guests.admin_password_hash | default(guests.extra_vm_admin_password_hash | default('')) if (guests is defined) else '' }}"
    mickey_codex_node_version: "24.15.0"

  pre_tasks:
    - name: Load secrets if provided
      ansible.builtin.include_vars:
        file: "{{ secret_vars_file }}"
      when: secret_vars_file is defined

    - name: Fail when the Samba password is missing for the website share mount
      ansible.builtin.fail:
        msg: "samba.password must be present in the secrets file to configure the website share mount."
      when: >-
        samba is not defined
        or samba.password is not defined
        or (samba.password | string | length) == 0

  handlers:
    - name: Validate Consul client config
      ansible.builtin.raw: |
        consul validate {{ mickey_consul_config_dir_effective | quote }}

    - name: Restart Consul client
      ansible.builtin.raw: |
        systemctl restart consul

  tasks:
    - name: Apply the shared VM base layer to the website guest
      ansible.builtin.include_tasks: ../tasks/bootstrap-vm-base.yml

    - name: Add the admin user to the Docker group
      ansible.builtin.user:
        name: "{{ mickey_guest_admin_user }}"
        groups: docker
        append: true

    - name: Enable the website VM services
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - docker
        - qemu-guest-agent

    - name: Configure the website Mickey share over CIFS
      ansible.builtin.include_tasks: ../tasks/configure-mickey-share-client.yml
      vars:
        mickey_share_client_mount_path: "{{ mickey_website_share_mount_path }}"
        mickey_share_client_name: "{{ mickey_website_share_name }}"
        mickey_share_client_server: "{{ mickey_website_share_server }}"
        mickey_share_client_credentials_path: "{{ mickey_website_share_credentials_path }}"
        mickey_share_client_fstab_options: "{{ mickey_website_share_fstab_options }}"
        mickey_share_client_username: "{{ samba.username | default(mickey_guest_admin_user) }}"
        mickey_share_client_password: "{{ samba.password }}"

    - name: Configure the website fast share over NFS
      ansible.builtin.include_tasks: ../tasks/configure-fast-share-nfs-client.yml
      vars:
        mickey_fast_share_client_mount_path: "{{ mickey_website_fast_share_mount_path }}"
      when: mickey_fast_share_nfs_enable | default(false) | bool

    - name: Apply the shared VM admin tooling layer to the website guest
      ansible.builtin.include_tasks: ../tasks/configure-vm-admin-tooling.yml

    - name: Ensure the website project root exists
      ansible.builtin.file:
        path: "{{ mickey_website_projects_root }}"
        state: directory
        owner: "{{ mickey_guest_admin_user }}"
        group: "{{ mickey_guest_admin_user }}"
        mode: "0755"

    - name: Configure GitHub CLI as the HTTPS Git credential helper
      become_user: "{{ mickey_guest_admin_user }}"
      ansible.builtin.command:
        cmd: gh auth setup-git --hostname github.com
      environment:
        HOME: "{{ mickey_guest_admin_home }}"
        GH_CONFIG_DIR: "{{ mickey_github_cli_config_dir }}"
      changed_when: false
      no_log: true

    - name: Clone the private Galvanic website repository once
      become_user: "{{ mickey_guest_admin_user }}"
      ansible.builtin.git:
        repo: "{{ mickey_website_repo_url }}"
        dest: "{{ mickey_website_repo_dir }}"
        version: main
        update: false
      environment:
        HOME: "{{ mickey_guest_admin_home }}"
