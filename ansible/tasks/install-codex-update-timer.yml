---
- name: Install the Codex fleet update systemd units
  ansible.builtin.raw: |
    set -eu
    units_dir={{ mickey_codex_update_units_dir | quote }}
    changed=0
    for unit in mickey-codex-update-everywhere.service mickey-codex-update-everywhere.timer; do
      src="$units_dir/$unit"
      dest="/etc/systemd/system/$unit"
      if [ ! -f "$src" ]; then
        echo "missing unit source $src" >&2
        exit 1
      fi
      if [ ! -f "$dest" ] || ! cmp -s "$src" "$dest"; then
        install -m 0644 -o root -g root "$src" "$dest"
        changed=1
      fi
    done
    if [ "$changed" = "1" ]; then
      systemctl daemon-reload
    fi
    if ! systemctl is-enabled mickey-codex-update-everywhere.timer >/dev/null 2>&1; then
      systemctl enable mickey-codex-update-everywhere.timer >/dev/null 2>&1
      changed=1
    fi
    if ! systemctl is-active mickey-codex-update-everywhere.timer >/dev/null 2>&1; then
      systemctl start mickey-codex-update-everywhere.timer
      changed=1
    fi
    if [ "$changed" = "1" ]; then
      echo changed
    fi
  register: mickey_codex_update_timer_result
  changed_when: "'changed' in mickey_codex_update_timer_result.stdout"
  when:
    - mickey_codex_enable | default(false) | bool
    - mickey_codex_update_timer_enable | default(false) | bool
    - inventory_hostname == (mickey_codex_update_timer_host | default(''))
